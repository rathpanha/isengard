[package]
name = "isengard"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-html",
    "tree-sitter-css",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# Sets the Dock icon at runtime so unbundled builds (`cargo run`) show the logo.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

# Metadata for `cargo bundle` (https://github.com/burtonageo/cargo-bundle),
# which builds a macOS .app / Linux .deb with the app icon.
[package.metadata.bundle]
name = "Isengard"
identifier = "dev.isengard.editor"
icon = ["assets/logo/Isengard.icns", "assets/logo/icon-1024.png"]
category = "public.app-category.developer-tools"
short_description = "A code editor built with GPUI Kit"

[profile.dev.package."*"]
opt-level = 2
