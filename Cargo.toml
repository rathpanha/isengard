[package]
name = "isengard"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
gpui-kit = { version = "0.7.1", features = ["tree-sitter-languages"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
rust-embed = "8"
# tree-sitter-sequel (SQL via tree-sitter-languages) needs cc ~1.2;
# without this, embed-resource locks cc 1.6 and resolution fails.
cc = "~1.2.1"
ignore = "0.4"
alacritty_terminal = "0.25.1"
portable-pty = "0.9"
parking_lot = "0.12"
flume = "0.12"
# Workspace file watching (reload clean tabs, refresh tree / Git on disk changes).
notify = "8"
ropey = "1"
# Open terminal URLs in the system browser (Ctrl/Cmd+click).
open = "5"

# Decode `icon-1024.png` for Linux/X11 `WindowOptions::icon` (and tests).
# png for window icon; ico/bmp/tiff/jpeg/gif/webp decode → PNG for ACP agent images
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
trash = "5"
regex = "1"
aho-corasick = "1"
similar = "2"
# Match GPUI Kit / gpui-base (CompletionProvider + diagnostics use the same types).
lsp-types = { version = "0.97", features = ["proposed"] }
url = "2"
# Local timezone for plan-usage reset tooltips (already in the Kit tree).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# App-local LSP downloads (blocking HTTP; no Tokio).
ureq = "3"
flate2 = "1"
tar = "0.4"
zip = "2"
xz2 = "0.1"
# Agent Client Protocol (external agents such as Claude Agent). Pinned: the
# 3.x API moves quickly. `process` spawns the agent; no Tokio — the connection
# runs on its own thread via `futures::executor::block_on`.
agent-client-protocol = { version = "=3.4.0", features = ["process"] }
futures = "0.3"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# Sets the Dock icon at runtime so unbundled builds (`cargo run`) show the logo.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
# Headless UI integration tests (`#[gpui_kit::test]`, `gpui_kit::test::*`).
gpui-kit = { version = "0.7.1", features = ["tree-sitter-languages", "test-support"] }

# Metadata for `cargo bundle` (https://github.com/burtonageo/cargo-bundle),
# which builds a macOS .app / Linux .deb with the app icon.
[package.metadata.bundle]
name = "Isengard"
identifier = "dev.isengard.editor"
icon = ["assets/logo/Isengard.icns", "assets/logo/icon-1024.png"]
category = "public.app-category.developer-tools"
short_description = "The already configured editor"

[profile.dev.package."*"]
opt-level = 2

# Kit completion docs used a fixed width and measured against relative X (wrong
# with a sidebar), so the pane walked off-screen. Also: Dialog enter motion
# stripped (Isengard wants instant modals). Patch until upstream lands options.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
