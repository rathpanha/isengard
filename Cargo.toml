[package]
name = "isengard"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-html",
    "tree-sitter-css",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
