[package]
name = "isengard"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui = "0.29"
rfd = "0.14"
tree-sitter = "0.23"
tree-sitter-highlight = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.23"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
