# Build, test, package (Linux .deb / .rpm / tarball, macOS .dmg / tarball,
# Windows .zip), and attach to a GitHub Release.
# Trigger: push tag v* (must match Cargo.toml version), or manual “Run workflow”.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/upload (e.g. v0.1.3)"
        required: true
        default: "v0.1.3"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # FakeAgent is thread-local; parallel gpui tests can race across threads.
  RUST_TEST_THREADS: "1"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch_deb: amd64
          # Uncomment when you want arm64 artifacts from GitHub’s ARM runners:
          # - os: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   arch_deb: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches Cargo.toml
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG_VER="${TAG#v}"
          CARGO_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "Tag $TAG (version $TAG_VER) != Cargo.toml $CARGO_VER" >&2
            echo "Bump Cargo.toml before tagging so packages and the binary agree." >&2
            exit 1
          fi
          echo "VERSION=$TAG_VER" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libxcursor-dev \
            libwayland-dev libasound2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Release build
        run: cargo build --release

      - name: Install nfpm
        run: |
          # Goreleaser asset names: Linux_x86_64 / Linux_arm64 (not linux_amd64).
          NFPM_VER=2.48.0
          NFPM_ARCH=x86_64
          case "$(uname -m)" in
            aarch64|arm64) NFPM_ARCH=arm64 ;;
          esac
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_${NFPM_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Package
        run: |
          # Prefer tag-derived VERSION (set above); script falls back to Cargo.toml.
          export VERSION="${VERSION:?}"
          chmod +x scripts/package-linux.sh packaging/linux/postinstall.sh
          ./scripts/package-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch_deb }}
          path: dist/linux/*

  # Universal (arm64 + x86_64) Isengard.app as .dmg + .tar.gz. Signed with the
  # self-signed certificate when MACOS_CERT_P12 is set, else ad-hoc (the
  # Keychain then re-asks for access after every update).
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches Cargo.toml
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG_VER="${TAG#v}"
          CARGO_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "Tag $TAG (version $TAG_VER) != Cargo.toml $CARGO_VER" >&2
            exit 1
          fi
          echo "VERSION=$TAG_VER" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::MACOS_CERT_P12 not set — signing ad-hoc (Keychain re-prompts after each update)"
            exit 0
          fi
          scripts/ci-macos-keychain.sh >> "$GITHUB_ENV"

      - name: Package
        run: scripts/package-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/macos/*.dmg
            dist/macos/*.tar.gz

  # Unsigned x86_64 zip (isengard.exe + LICENSE + credits). Installed by
  # scripts/install-windows.ps1 and updated in place by the app.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches Cargo.toml
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ inputs.tag }}" } else { $tag = $env:GITHUB_REF_NAME }
          $tagVer = $tag.TrimStart('v')
          $cargoVer = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tagVer -ne $cargoVer) {
            Write-Error "Tag $tag (version $tagVer) != Cargo.toml $cargoVer"
            exit 1
          }
          "VERSION=$tagVer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tests and clippy run on the Linux and macOS jobs; the suite assumes
      # Unix paths in places, so Windows only builds and packages.
      - name: Package
        run: ./scripts/package-windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/windows/*.zip

  publish:
    needs: [linux, macos, windows]
    # A broken macOS build must not block the Linux release (the run still
    # shows red so the missing macOS assets are noticed).
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Stage release files
        run: |
          mkdir -p dist
          find release-assets -type f ! -name SHA256SUMS -print -exec cp -t dist {} +
          (cd dist && shasum -a 256 ./* >SHA256SUMS)
          ls -la dist

      # The in-app updater refuses any download whose SHA256SUMS is not signed
      # with the key embedded in the binary (src/update.rs PUBLIC_KEY).
      # One-time setup: `minisign -G`, put the secret key file contents in the
      # MINISIGN_KEY secret and its password in MINISIGN_PASSWORD, and the
      # public key line in PUBLIC_KEY. Without the secret the release still
      # publishes, but unsigned (the updater then only links to the release).
      - name: Sign SHA256SUMS
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::warning::MINISIGN_KEY not set — publishing without SHA256SUMS.minisig"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$MINISIGN_KEY" >"$KEYFILE"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEYFILE" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig

      - name: Resolve tag and notes
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Isengard ${{ steps.tag.outputs.name }}
          body_path: ${{ steps.tag.outputs.notes }}
          files: dist/*
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
